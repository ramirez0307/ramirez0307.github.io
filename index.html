<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Official support and privacy information for Steady Steps." />
    <title>Steady Steps — App Support</title>
    <style>
      :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { align-items: center; background: #f5f8f5; color: #172119; display: flex; margin: 0; min-height: 100vh; }
      main { box-sizing: border-box; margin: 0 auto; max-width: 680px; padding: 48px 24px; width: 100%; }
      .card { background: #fff; border: 1px solid #d6e2d5; border-radius: 20px; box-shadow: 0 14px 40px rgb(23 33 25 / 8%); padding: clamp(28px, 7vw, 56px); }
      .eyebrow { color: #316b43; font-size: .8rem; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; }
      h1 { font-size: clamp(2.2rem, 7vw, 3.6rem); letter-spacing: -.05em; line-height: 1; margin: 12px 0 18px; }
      p { font-size: 1.08rem; line-height: 1.65; max-width: 57ch; }
      a { color: #fff; background: #25683a; border-radius: 10px; display: inline-block; font-weight: 700; margin-top: 12px; padding: 13px 18px; text-decoration: none; }
      a:hover { background: #1d5130; }
      footer { color: #526355; font-size: .9rem; margin-top: 24px; }
      @media (prefers-color-scheme: dark) {
        body { background: #101711; color: #e8f0e8; }
        .card { background: #172119; border-color: #304634; box-shadow: none; }
        .eyebrow { color: #9bdca8; }
        a { background: #4f9d61; color: #071209; }
        a:hover { background: #82c990; }
        footer { color: #a4b8a8; }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card" aria-labelledby="title">
        <div class="eyebrow">Steady Steps</div>
        <h1 id="title">App support</h1>
        <p>Steady Steps is a local-first Android habit tracker. Your habit data stays on your device.</p>
        <a href="https://ramirez0307.github.io/steady-steps-privacy-policy/">Read the Privacy Policy</a>
        <footer>Official support page for the Steady Steps Android app.</footer>
      </section>
    </main>
  </body>
</html>
